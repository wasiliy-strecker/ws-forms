name: PHP syntax

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Parse PHP files
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Reject local artifacts
        run: test -z "$(find . -type d -name .idea -print -quit)"
