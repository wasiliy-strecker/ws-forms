<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Germany - Multi Marker</title>
    <style>
        /* CSS with underscore-based ID */
        #google_map_germany_container {
            height: 600px;
            width: 100%;
            border: 1px solid #ccc;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
    </style>
</head>
<body>

<h2>Deutschlandweite Standorte</h2>
<div id="google_map_germany_container"></div>

<script>
    // Initialize map with multiple locations in camelCase
    function initGermanyMap() {
        // Array with 10 locations across Germany
        const locationList = [
            { lat: 53.5511, lng: 9.9937, title: "Hamburg" },
            { lat: 54.3233, lng: 10.1228, title: "Kiel" },
            { lat: 52.5200, lng: 13.4050, title: "Berlin" },
            { lat: 51.0504, lng: 13.7373, title: "Dresden" },
            { lat: 48.1351, lng: 11.5820, title: "Munich" },
            { lat: 47.5667, lng: 10.7000, title: "Füssen" },
            { lat: 50.1109, lng: 8.6821, title: "Frankfurt" },
            { lat: 51.2277, lng: 6.7735, title: "Düsseldorf" },
            { lat: 48.7758, lng: 9.1829, title: "Stuttgart" },
            { lat: 53.1435, lng: 8.2146, title: "Oldenburg" }
        ];

        // Basic map options
        const mapOptions = {
            mapTypeId: google.maps.MapTypeId.ROADMAP
        };

        // Create map instance
        const map = new google.maps.Map(document.getElementById("google_map_germany_container"), mapOptions);

        // Create bounds object to manage zoom automatically
        const mapBounds = new google.maps.LatLngBounds();

        // Define the custom icon
        const customIcon = {
            url: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTI-qNJiNrLGwroA28PKW-pKVdeuMcEinitW3mvzw1fzg&s&ec=121532756",
            // Scaled size to make it fit nicely (adjust as needed)
            scaledSize: new google.maps.Size(40, 40),
            // The anchor sets the point which will correspond to the marker's location (center-bottom)
            anchor: new google.maps.Point(20, 40)
        };

        // Loop through locations to create markers
        locationList.forEach((loc) => {
            const marker = new google.maps.Marker({
                position: { lat: loc.lat, lng: loc.lng },
                map: map,
                title: loc.title,
                icon: customIcon // Applying the logo here
            });

            // Add position to bounds
            mapBounds.extend(marker.getPosition());
        });

        // Auto-zoom to fit all markers with 50px padding
        map.fitBounds(mapBounds, 50);
    }
</script>

<script async src="https://maps.googleapis.com/maps/api/js?key=xxxxxx&callback=initGermanyMap"></script>

</body>
</html>
